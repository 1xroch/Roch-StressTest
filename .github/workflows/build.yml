name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # The self-test builds every tab and preset against the tool folders in this repository, then
    # PyInstaller makes the exe. Nothing is run against hardware: there is none on a runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the build requirements
        run: python -m pip install -r requirements.txt
      - name: Self-test
        run: python selftest.py
      - name: Build RochStressTest.exe
        run: python -m PyInstaller -y RochStressTest.spec
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path core/version.py -Pattern '__version__ = "(.*)"').Matches[0].Groups[1].Value
          # The same layout as 1.0.0's zip: one RochStressTest folder, the exe and the tools in it.
          $dir = "RochStressTest"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item dist/RochStressTest.exe $dir/
          foreach ($item in 'p95v3019b20.win64', 'y-cruncher v0.8.7.9547b', 'TestMem5', 'ram_test_pro_1.5.0',
                            'LinpackXtreme-1.1.7', 'Linpack-Extended-master', 'memtest_vulkan', 'README.md', 'LICENSE') {
            Copy-Item -Recurse $item $dir/
          }
          New-Item -ItemType Directory -Path dist-zip | Out-Null
          Compress-Archive -Path $dir -DestinationPath "dist-zip/RochStressTest-$version.zip"
          Copy-Item dist/RochStressTest.exe dist-zip/
          Get-ChildItem dist-zip
      - uses: actions/upload-artifact@v4
        with:
          name: roch-stresstest-windows
          path: dist-zip/
          if-no-files-found: error

  linux:
    # Built in Ubuntu 22.04 so the binary runs on glibc 2.35 and newer. Python 3.13 and its Tk come
    # from the deadsnakes archive; Ubuntu's Tk draws with Xft, which CustomTkinter's rounded shapes
    # and arrows need. The Linux tools are fetched from their authors' sites and checked by hash.
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Python 3.13 with Tk, and what the build uses
        run: |
          apt-get update -q
          apt-get install -y -q software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update -q
          apt-get install -y -q python3.13 python3.13-venv python3.13-tk binutils curl xz-utils \
            xvfb xauth fontconfig fonts-dejavu-core git
      - uses: actions/checkout@v4
      - name: Install the build requirements
        run: |
          python3.13 -m venv /opt/venv
          /opt/venv/bin/python -m pip install -q -r requirements.txt
      - name: Fetch the Linux tools
        run: packaging/linux/fetch-tools.sh
      - name: Self-test
        run: xvfb-run -a /opt/venv/bin/python selftest.py
      - name: Build and package
        run: |
          /opt/venv/bin/python -m PyInstaller -y RochStressTest.spec
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' core/version.py)
          dir="RochStressTest-$version-linux-x86_64"
          mkdir -p "$dir" dist-linux
          install -m755 dist/RochStressTest "$dir/RochStressTest"
          packaging/linux/fetch-tools.sh "$dir"
          install -m755 packaging/linux/install.sh "$dir/install.sh"
          install -m644 packaging/linux/RochStressTest.desktop "$dir/RochStressTest.desktop"
          install -m644 icon.png "$dir/RochStressTest.png"
          cp README.md LICENSE "$dir/"
          # The packaged program must start and stay up: a missing module ends it at once.
          set +e
          xvfb-run -a timeout 15 "$dir/RochStressTest" > smoke.log 2>&1
          code=$?
          set -e
          cat smoke.log
          [ "$code" = 124 ] || { echo "RochStressTest exited with $code during the smoke test"; exit 1; }
          ! grep -q Traceback smoke.log
          tar -czf "dist-linux/$dir.tar.gz" "$dir"
          ls -l dist-linux
      - uses: actions/upload-artifact@v4
        with:
          name: roch-stresstest-linux
          path: dist-linux/
          if-no-files-found: error
