name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Lint, the tests (including the self-test, which builds every preset and Quick Start button
    # against the tool folders in this repository), then the release exe and the zip with the tools
    # beside it. Nothing is run against hardware: there is none on a runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run the tests
        run: cargo test --locked

      - name: Build and package
        shell: pwsh
        run: |
          cargo build --release --locked
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          # The same layout as 1.0.0's zip: one RochStressTest folder, the exe and the tools in it.
          $dir = "RochStressTest"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item target/release/RochStressTest.exe $dir/
          foreach ($item in 'p95v3019b20.win64', 'y-cruncher v0.8.7.9547b', 'TestMem5', 'ram_test_pro_1.5.0',
                            'LinpackXtreme-1.1.7', 'Linpack-Extended-master', 'memtest_vulkan', 'README.md', 'LICENSE') {
            Copy-Item -Recurse $item $dir/
          }
          # A windows-subsystem exe is not waited for by `&`, so it is started and waited on.
          $run = Start-Process -FilePath "$dir/RochStressTest.exe" -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($run.ExitCode -ne 0) { throw "The packaged program's self-test failed" }
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path $dir -DestinationPath "dist/RochStressTest-$version.zip"
          Copy-Item target/release/RochStressTest.exe dist/
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: roch-stresstest-windows
          path: dist/
          if-no-files-found: error

  linux:
    # Built in Ubuntu 22.04 so the binary runs on glibc 2.35 and newer; the window's system libraries
    # are loaded at run time. The Linux tools are fetched from their authors' sites, checked by hash.
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the compiler, and what the steps below use
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gcc git libc6-dev binutils pkg-config xz-utils

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04

      - name: Fetch the Linux tools
        run: packaging/linux/fetch-tools.sh

      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Run the tests
        run: cargo test --locked

      - name: Build and package
        run: |
          cargo build --release --locked
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          # Only the C library and what every Linux has: the window's libraries load at run time.
          ! ldd target/release/RochStressTest | grep -vE 'linux-vdso|ld-linux|libc\.so|libm\.so|libgcc_s\.so'
          dir="RochStressTest-$version-linux-x86_64"
          mkdir -p "$dir" dist
          install -m755 target/release/RochStressTest "$dir/RochStressTest"
          packaging/linux/fetch-tools.sh "$dir"
          install -m755 packaging/linux/install.sh "$dir/install.sh"
          install -m644 packaging/linux/RochStressTest.desktop "$dir/RochStressTest.desktop"
          install -m644 assets/icon.png "$dir/RochStressTest.png"
          cp README.md LICENSE "$dir/"
          "$dir/RochStressTest" --selftest
          tar -czf "dist/$dir.tar.gz" "$dir"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: roch-stresstest-linux
          path: dist/
          if-no-files-found: error
